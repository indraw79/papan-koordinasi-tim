<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAPAN TUGAS</title>
<style>
  :root {
    --accent: #4f46e5;
    --accent-light: #eef2ff;
    --bg: #f8fafc;
    --card: #ffffff;
    --text: #1e293b;
    --muted: #64748b;
    --border: #e2e8f0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 24px 20px;
    text-align: center;
  }
  header h1 {
    margin: 0 0 4px;
    font-size: 1.6rem;
  }
  header p {
    margin: 0;
    color: var(--muted);
    font-size: 0.95rem;
  }
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px 20px 60px;
  }
  .form-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 28px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  .form-card h2 {
    margin: 0 0 16px;
    font-size: 1.05rem;
  }
  .form-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .form-row .field {
    flex: 1 1 200px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  label {
    font-size: 0.8rem;
    color: var(--muted);
    font-weight: 600;
  }
  input, select {
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.95rem;
    background: #fff;
    color: var(--text);
  }
  input:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-light);
  }
  button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    align-self: flex-end;
  }
  button:hover { background: #4338ca; }

  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }
  .column {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    min-height: 200px;
  }
  .column h3 {
    margin: 0 0 12px;
    font-size: 0.95rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .count {
    background: var(--accent-light);
    color: var(--accent);
    border-radius: 999px;
    padding: 2px 10px;
    font-size: 0.75rem;
    font-weight: 700;
  }
  .task {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .task .nama {
    font-weight: 600;
    margin-bottom: 4px;
  }
  .task .pj {
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 10px;
  }
  .task-actions {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .task-actions select {
    flex: 1;
    padding: 6px 8px;
    font-size: 0.85rem;
  }
  .hapus {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 6px 10px;
    font-size: 0.8rem;
    font-weight: 500;
  }
  .hapus:hover {
    background: #fee2e2;
    color: #dc2626;
    border-color: #fecaca;
  }
  .empty {
    color: var(--muted);
    font-size: 0.85rem;
    text-align: center;
    padding: 20px 0;
  }

  @media (max-width: 720px) {
    .board { grid-template-columns: 1fr; }
    button { width: 100%; }
  }
</style>
</head>
<body>

<header>
  <h1>PAPAN TUGAS</h1>
  <p>Satu layar untuk lihat siapa mengerjakan apa, tanpa scroll chat</p>
</header>

<main>
  <section class="form-card">
    <h2>Tambah Tugas Baru</h2>
    <form id="form-tugas">
      <div class="form-row">
        <div class="field">
          <label for="nama-tugas">Nama Tugas</label>
          <input id="nama-tugas" type="text" placeholder="Misal: Buat laporan mingguan" required>
        </div>
        <div class="field">
          <label for="penanggung-jawab">Penanggung Jawab</label>
          <input id="penanggung-jawab" type="text" placeholder="Misal: Dinda" required>
        </div>
        <div class="field">
          <label for="status-awal">Status</label>
          <select id="status-awal">
            <option value="Belum Mulai">Belum Mulai</option>
            <option value="Dikerjakan">Dikerjakan</option>
            <option value="Selesai">Selesai</option>
          </select>
        </div>
        <button type="submit">Tambah Tugas</button>
      </div>
    </form>
  </section>

  <section class="board" id="board">
    <div class="column" data-status="Belum Mulai">
      <h3>Belum Mulai <span class="count" id="count-belum-mulai">0</span></h3>
      <div class="list" id="list-belum-mulai"></div>
    </div>
    <div class="column" data-status="Dikerjakan">
      <h3>Dikerjakan <span class="count" id="count-dikerjakan">0</span></h3>
      <div class="list" id="list-dikerjakan"></div>
    </div>
    <div class="column" data-status="Selesai">
      <h3>Selesai <span class="count" id="count-selesai">0</span></h3>
      <div class="list" id="list-selesai"></div>
    </div>
  </section>
</main>

<script>
  const STORAGE_KEY = "papan-koordinasi-tim-tugas";
  const STATUS_LIST = ["Belum Mulai", "Dikerjakan", "Selesai"];

  const form = document.getElementById("form-tugas");
  const inputNama = document.getElementById("nama-tugas");
  const inputPJ = document.getElementById("penanggung-jawab");
  const inputStatusAwal = document.getElementById("status-awal");

  function ambilTugas() {
    const data = localStorage.getItem(STORAGE_KEY);
    return data ? JSON.parse(data) : [];
  }

  function simpanTugas(tugas) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tugas));
  }

  function idKolom(status) {
    return "list-" + status.toLowerCase().replace(/ /g, "-");
  }

  function idHitung(status) {
    return "count-" + status.toLowerCase().replace(/ /g, "-");
  }

  function render() {
    const semuaTugas = ambilTugas();

    STATUS_LIST.forEach(status => {
      const list = document.getElementById(idKolom(status));
      const tugasKolom = semuaTugas.filter(t => t.status === status);

      document.getElementById(idHitung(status)).textContent = tugasKolom.length;

      if (tugasKolom.length === 0) {
        list.innerHTML = '<div class="empty">Belum ada tugas</div>';
        return;
      }

      list.innerHTML = tugasKolom.map(t => `
        <div class="task" data-id="${t.id}">
          <div class="nama">${escapeHTML(t.nama)}</div>
          <div class="pj">Penanggung jawab: ${escapeHTML(t.penanggungJawab)}</div>
          <div class="task-actions">
            <select onchange="ubahStatus('${t.id}', this.value)">
              ${STATUS_LIST.map(s => `<option value="${s}" ${s === t.status ? "selected" : ""}>${s}</option>`).join("")}
            </select>
            <button class="hapus" onclick="hapusTugas('${t.id}')">Hapus</button>
          </div>
        </div>
      `).join("");
    });
  }

  function escapeHTML(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function ubahStatus(id, statusBaru) {
    const semuaTugas = ambilTugas();
    const tugas = semuaTugas.find(t => t.id === id);
    if (tugas) {
      tugas.status = statusBaru;
      simpanTugas(semuaTugas);
      render();
    }
  }

  function hapusTugas(id) {
    const semuaTugas = ambilTugas().filter(t => t.id !== id);
    simpanTugas(semuaTugas);
    render();
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    const nama = inputNama.value.trim();
    const penanggungJawab = inputPJ.value.trim();
    const status = inputStatusAwal.value;

    if (!nama || !penanggungJawab) return;

    const semuaTugas = ambilTugas();
    semuaTugas.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      nama,
      penanggungJawab,
      status
    });
    simpanTugas(semuaTugas);

    inputNama.value = "";
    inputPJ.value = "";
    inputStatusAwal.value = "Belum Mulai";
    inputNama.focus();

    render();
  });

  render();
</script>

</body>
</html>
